[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livraison-express"
version = "1.0.0"
description = "Prédiction d'éligibilité d'une commande à la livraison express"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
# The notebook is the original experiment, kept as received.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E4/E7/E9/F: pyflakes and pycodestyle errors (unused imports, undefined names...); I: import order.
select = ["E4", "E7", "E9", "F", "I"]
