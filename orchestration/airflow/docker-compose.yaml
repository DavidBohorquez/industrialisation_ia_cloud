# livraison-express: Airflow orchestration of the model retraining (ADR-0014).
#
#   cp .env.example .env                  required: this file reads .env (see env_file below)
#   docker compose up airflow-init        once: database migration + admin account
#   docker compose up -d --wait           start Airflow, return once every service is healthy
#   open http://127.0.0.1:8080            UI (login: _AIRFLOW_WWW_USER_* from .env)
#   docker compose down                   stop (add -v to delete Airflow's database)
#
# This is the official file of Airflow 3.4.0, CeleryExecutor (scheduler, dag-processor,
# api-server, triggerer, Celery worker, Redis broker, PostgreSQL metadata database):
#   https://airflow.apache.org/docs/apache-airflow/3.4.0/docker-compose.yaml
#   original sha256: ac8c8f2d6e7aaa2ddc069d1ac3eefee3cb975285c08860896bf8d75ea2010f12
# Diff against upstream: curl -Lfs <url above> | diff - docker-compose.yaml
#
# Changes, each marked "livraison-express:" below (Apache-2.0 section 4b: modified file):
#   1. name: airflow-tp4                  fixed Compose project name (containers, volume names).
#   2. AIRFLOW__CORE__LOAD_EXAMPLES       'false': only our DAG in the UI.
#   3. AIRFLOW_CONN_ERP_POSTGRES          connection "erp_postgres" to the ERP database, read-only
#                                         role ml_reader (password ML_READER_PASSWORD, test default).
#   4. ports                              api-server and flower bound to 127.0.0.1 (this machine
#                                         only), as in the project's root docker-compose.yml.
#   5. airflow-worker only (the Celery worker is the process that runs the tasks):
#      a. /var/run/docker.sock mounted    the DockerOperator asks the host's Docker engine to
#                                         start the training image. Access to this socket is
#                                         root-equivalent on the host: whoever controls a DAG
#                                         controls the machine. Acceptable on a developer
#                                         machine; in the cloud, run the training image as a
#                                         Kubernetes pod (KubernetesPodOperator) or a managed
#                                         job instead, without any Docker socket.
#      b. volumes repeated                YAML merge (<<) replaces lists, it does not extend
#                                         them: the four common volumes are listed again.
#      c. group_add DOCKER_GID            Linux: the socket belongs to the "docker" group, which
#                                         the airflow user (group 0) is not in. Docker Desktop:
#                                         the socket is root:root 0660, group 0 is enough.
#      d. networks default + livraison-net  the external network of the ERP stack, so that
#                                         the SQL check reaches host erp-postgres. Only the
#                                         worker joins it: the metadata database's service
#                                         name "postgres" would clash on a shared network.
#   6. networks: livraison-net (external) created by the ERP/test stack, never by this file.
#
